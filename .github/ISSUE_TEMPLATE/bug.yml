name: Bug
description: Something broken in a build
title: "bug: "
labels: ["type:bug"]
body:
  - type: input
    id: version
    attributes:
      label: Mod version or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Crash report or log
      render: text

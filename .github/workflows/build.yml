name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Run datagen
        run: ./gradlew runData

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Check generated resources are committed
        run: |
          git add -N src/generated
          # Generated PNGs are excluded: PNG compression differs between JDK builds, so bytes aren't stable.
          git diff --exit-code -- src/generated ':!**/.cache/**' ':!**/*.png' || (echo "::error::Run ./gradlew runData and commit src/generated" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: lotrrevival-jar
          path: build/libs/*.jar

  # Boots a real headless NeoForge client with the mod, joins a world, runs GameTests, exits.
  # Catches crashes on load, registry errors and render-side exceptions without a human.
  runtime-test:
    needs: build
    runs-on: ubuntu-latest
    # A failing GameTest can leave the headless client hanging instead of exiting.
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/download-artifact@v4
        with:
          name: lotrrevival-jar
          path: build/libs

      - name: Stage mod for test client
        run: |
          mkdir -p run/mods
          cp $(ls build/libs/*.jar | grep -v -- '-sources' | head -1) run/mods/

      - name: Run headless client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: 1.21.1
          modloader: neoforge
          mc-runtime-test: neoforge
          java: '21'
          # Client smoke test only: boot, join a world, exit. GameTests run in the build job on the
          # GameTest server; in a client world, test areas outside simulation distance never tick.
          headlessmc-command: --jvm "-DMcRuntimeGameTest=false"

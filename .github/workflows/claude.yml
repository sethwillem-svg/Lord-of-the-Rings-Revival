name: Claude agent

# Two ways to start an agent:
#   1. Add the `claude` label to an issue -> an agent implements it and opens a PR.
#      Spec issues (type:spec) run on Opus; everything else runs on Sonnet.
#   2. Comment `@claude ...` on an issue or PR -> an agent responds or makes changes.
# Auth: set ONE secret, CLAUDE_CODE_OAUTH_TOKEN (Claude subscription, from `claude setup-token`)
#       or ANTHROPIC_API_KEY (Console, billed per token). See docs/tooling.md.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  implement-issue:
    if: github.event_name == 'issues' && github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'type:spec') && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --allowedTools "Bash(./gradlew:*),Bash(git:*),Bash(gh:*)"
          prompt: |
            Implement issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}") in ${{ github.repository }}.
            Read AGENTS.md first and follow it exactly: clean-room rule, pod ownership, datagen-first.
            If the issue is labeled type:spec, write the spec under specs/<pod>/ from specs/_TEMPLATE.md instead of code.
            Work on a branch named <pod>/${{ github.event.issue.number }}-<short-slug>.
            Run ./gradlew build runData and commit src/generated.
            Open a PR that closes #${{ github.event.issue.number }} using the PR template.
            If something blocks you, comment on the issue explaining what and stop.

  respond-to-mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Bash(./gradlew:*),Bash(git:*),Bash(gh:*)"

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = mod_version
group = mod_group
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run')
            // ./gradlew runClient -Pautotest=100: unattended renderer benchmark (client.bench.AutoBench)
            if (project.hasProperty('autotest')) systemProperty 'lotr_revival.autotest', project.property('autotest').toString()
            if (project.hasProperty('profile')) systemProperty 'lotr_revival.profile', 'true'
            // ./gradlew runClient -Pexport=1: record every Middle-earth NPC type for the NPC clip viewer (client.bench.ExportRun)
            if (project.hasProperty('export')) systemProperty 'lotr_revival.export', project.property('export').toString()
            // -PquickPlay=<world>: open that saved world straight from launch (bench.sh uses it once the bench world exists)
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
        }
        // ./gradlew runGameTestServer -PmeJar=...: the add-on's game tests (combat.test) on a headless server, then quits
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

repositories {
    maven { url = 'https://arcanc.github.io/Maven/'; content { includeGroup 'com.arcanc.pulselib' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    implementation "com.arcanc.pulselib:pulselib-neoforge:${pulselib_version}"
    // Spark profiler in dev runs only (bench.sh profiles the renderers with it); not a dependency of the add-on
    if (!project.hasProperty('noSpark')) runtimeOnly "maven.modrinth:spark:${spark_version}"   // -PnoSpark: without it

    // The Middle-earth mod is All Rights Reserved: compiled against and run from your local build, never bundled or committed.
    def me = providers.gradleProperty('meJar').getOrElse('')
    if (!me || !file(me).exists()) {
        throw new GradleException("Set -PmeJar=/path/to/middle-earth.jar (build it from Jukoz/middle-earth, branch neoforge-fixes)")
    }
    compileOnly files(me)
    runtimeOnly files(me)
}

tasks.named('processResources', ProcessResources) {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
